name: Refresh public catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python scanner.py --sections arabic tools ps5 ps4 --max-pages 200 --delay 1
      - name: Commit refreshed JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public PSPKG catalogue'
            git push
          fi
